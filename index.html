<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Chúc Mừng Năm Mới</title>
  <style>
    body{
      margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      font-family: Arial, sans-serif; color:#fff;
      background: radial-gradient(circle at top, #ffcc70, #c850c0, #4158d0);
      text-align:center; padding:24px;
    }
    .card{
      max-width:720px; width:100%;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 18px;
      padding: 28px 22px;
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }
    h1{ margin:0 0 10px; font-size: 40px; }
    p{ margin: 8px 0; font-size: 20px; line-height: 1.4; }
    .small{ opacity:0.9; font-size: 16px; margin-top: 14px; }
    button{
      margin-top: 16px; padding: 10px 16px; border:0; border-radius: 12px;
      cursor:pointer; font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎉 Chúc Mừng Năm Mới! 🎉</h1>
    <p>Chúc Bạn một năm mới <b>an khang – thịnh vượng – vạn sự như ý</b>.</p>
    <p>Luôn mạnh khỏe, hạnh phúc và thành công! ✨</p>
    <button onclick="alert('Chúc mừng năm mới! 🎆')">Bấm để nhận lộc</button>
    <div class="small">Trang này được tạo bằng GitHub Pages.</div>
  </div>
</body>
</html>
